id: DET-007
name: Password Spraying Detection
description: >
  Detects password spraying attacks by identifying multiple failed logon
  attempts against different accounts from the same source IP within a
  short time window. Differs from brute force by targeting many accounts
  with few attempts each to avoid lockouts.
mitre_attack:
  tactic: Credential Access
  technique_id: T1110.003
  technique_name: "Brute Force: Password Spraying"
data_sources:
  - index: windows_security
    eventcode: 4625
    sourcetype: WinEventLog:Security
splunk_query: |
  index=windows_security EventCode=4625
  | bin _time span=5m
  | stats dc(Account_Name) as unique_accounts, count as total_failures
      by src_ip, _time, Computer
  | where unique_accounts >= 5 AND total_failures >= 10
false_positives:
  - Misconfigured services with bad credentials
  - Users forgetting passwords on multiple accounts
tuning_notes: >
  Adjust unique_accounts and total_failures thresholds based on
  your environment baseline. Start high and tune down.
testing:
  command: "for ($i=1; $i -le 10; $i++) { net use \\\\localhost\\IPC$ /user:fakeuser$i WrongPassword }"
  result: DETECTED
  fp_rate: Low
status: production
